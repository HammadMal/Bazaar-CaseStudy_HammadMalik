<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div class="d-flex align-items-center">
      <img src="{{ url_for('static', filename='images.png') }}" alt="Logo" height="50" class="me-3">
      <h1 class="mb-0">📦 Bazaar Inventory Dashboard</h1>
    </div>
    <a href="/add" class="btn btn-primary">➕ Add New Product</a>
  </div>
  
  <form method="POST">
    <div class="mb-3">
      <label>🔹 SKU (Unique)</label>
      <input name="sku" class="form-control" placeholder="e.g. ABC123" required>
    </div>
    <div class="mb-3">
      <label>🔹 Product Name</label>
      <input name="name" class="form-control" placeholder="e.g. Dove Soap Bar" required>
    </div>
    <div class="mb-3">
      <label>📝 Description (optional)</label>
      <textarea name="description" class="form-control" placeholder="e.g. 100g moisturizing soap"></textarea>
    </div>
    <div class="mb-3">
      <label>📦 Category</label>
      <input name="category" class="form-control" placeholder="e.g. Grocery, Personal Care, Snacks">
    </div>
    <div class="mb-3">
      <label>⚖️ Unit</label>
      <input name="unit" class="form-control" placeholder="e.g. pcs, kg, liter">
    </div>
    <button type="submit" class="btn btn-primary">Add Product</button>
    <a href="/" class="btn btn-secondary">Cancel</a>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
