# nginx/nginx.conf
events {
    worker_connections 1024;
}

http {
    upstream bazaar_api {
        least_conn;  # Use least connections balancing method
        server api:5000;
        server api:5000;
        server api:5000;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://bazaar_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://bazaar_api/health;
            access_log off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}