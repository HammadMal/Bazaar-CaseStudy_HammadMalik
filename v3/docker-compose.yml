version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: bazaar-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - bazaar-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    deploy:
      replicas: 3  # Start with 3 instances
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - DATABASE_URL=postgresql://bazaar:${POSTGRES_PASSWORD}@db:5432/bazaar_inventory
      - READ_DATABASE_URL=postgresql://bazaar:${POSTGRES_PASSWORD}@db_replica:5432/bazaar_inventory
      - SECRET_KEY=${SECRET_KEY}
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RABBITMQ_URL=amqp://bazaar:${POSTGRES_PASSWORD}@rabbitmq:5672
      - RABBITMQ_DEFAULT_USER=bazaar
      - RABBITMQ_DEFAULT_PASS=${POSTGRES_PASSWORD}
    depends_on:
      - db
      - db_replica
      - redis
      - rabbitmq
    networks:
      - bazaar-network

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: python worker.py
    deploy:
      replicas: 2  # Start with 2 worker instances
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    environment:
      - DATABASE_URL=postgresql://bazaar:${POSTGRES_PASSWORD}@db:5432/bazaar_inventory
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - RABBITMQ_URL=amqp://bazaar:${POSTGRES_PASSWORD}@rabbitmq:5672
      - RABBITMQ_DEFAULT_USER=bazaar
      - RABBITMQ_DEFAULT_PASS=${POSTGRES_PASSWORD}
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - bazaar-network

  db:
    image: postgres:14
    container_name: bazaar-db-primary
    restart: always
    environment:
      - POSTGRES_USER=bazaar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bazaar_inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Configure PostgreSQL for primary role
      - ./postgres/primary:/docker-entrypoint-initdb.d
    networks:
      - bazaar-network

  db_replica:
    image: postgres:14
    container_name: bazaar-db-replica
    restart: always
    command: postgres -c hot_standby=on
    environment:
      - POSTGRES_USER=bazaar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=bazaar_inventory
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      # Configure PostgreSQL for replica role
      - ./postgres/replica:/docker-entrypoint-initdb.d
    depends_on:
      - db
    networks:
      - bazaar-network

  redis:
    image: redis:alpine
    container_name: bazaar-redis
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - bazaar-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bazaar-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=bazaar
      - RABBITMQ_DEFAULT_PASS=${POSTGRES_PASSWORD}
    networks:
      - bazaar-network

networks:
  bazaar-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  rabbitmq_data: